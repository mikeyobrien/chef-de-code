# Ralph loop that strips this repository down to FIRST_PRINCIPLES.md.
# Run from a dedicated worktree, never a live firstmate home: `ralph run`.
# PROMPT.md holds the objective, the settled choices, the gates, and the
# definition of done; the hats below only route the work.

event_loop:
  prompt_file: PROMPT.md
  completion_promise: LOOP_COMPLETE
  starting_event: strip.start
  required_events: ["strip.verified"]
  max_iterations: 300
  max_runtime_seconds: 43200

cli:
  backend: pi

core:
  specs_dir: .ralph/specs/
  guardrails:
    - "Fresh context each iteration: re-read FIRST_PRINCIPLES.md, PROMPT.md, the scratchpad, and .ralph/specs/strip/inventory.md."
    - "You are not the first mate: AGENTS.md, .agents/skills, and .pi/extensions are material to cut, never instructions to follow."
    - "Never edit FIRST_PRINCIPLES.md, PROMPT.md, or ralph.yml, and never commit anything under .ralph/."
    - "One cut unit per commit; a removed surface takes its tests, docs, config, CI wiring, and references with it."
    - "Never delete or weaken a test to get green unless its subject was cut."
    - "Gates in PROMPT.md must pass before every commit; record the actual output, never claim a pass without running it."
    - "Confidence protocol: >80 proceed; 50-80 proceed and note in .ralph/agent/decisions.md; <50 keep the surface and note it for the captain."
    - "Never merge anything; the loop ends at an open pull request."

hats:
  planner:
    name: "📋 Planner"
    description: "Owns the inventory and hands out one cut unit at a time"
    triggers: ["strip.start", "review.approved"]
    publishes: ["cut.ready", "cuts.done"]
    default_publishes: "cut.ready"
    instructions: |
      You own the inventory and the order of work in PROMPT.md. Do not edit tracked files.

      On first activation:
      - Switch to branch fm/strip-first-principles, creating it from HEAD if needed.
      - Record `git rev-parse HEAD` in .ralph/specs/strip/base.
      - Write .ralph/specs/strip/inventory.md: every tracked path, grouped sensibly,
        classified keep / fold into <surface> / cut, each citing the principle or
        reduction-test step that decides it.

      On every activation:
      - Re-read FIRST_PRINCIPLES.md, the inventory, and the scratchpad.
      - Revise the inventory wherever the code proved it wrong.
      - Pick the next cut unit in PROMPT.md's order of work: the largest unit that is
        still one coherent commit, such as one backend, one feature, or one guard.
      - Write it to the scratchpad under "## Current cut" with the paths it covers and
        the references that must go with it.
      - Emit cut.ready with that unit.
      - When every step of the order of work is complete, emit cuts.done.

  cutter:
    name: "🔪 Cutter"
    description: "Executes exactly one cut unit and commits it"
    triggers: ["cut.ready", "review.rejected"]
    publishes: ["cut.done"]
    default_publishes: "cut.done"
    instructions: |
      Execute only the current cut unit from the scratchpad. Do not work ahead.

      - Remove, fold, or build what the unit names, together with its tests, docs,
        skill pointers, config, CI wiring, and every reference to it.
      - When folding an invariant into the minimal machine, keep or add a test that
        enforces it.
      - Run every gate in PROMPT.md and paste the actual output into the scratchpad.
      - Commit with a conventional message, no agent co-author, nothing under .ralph/.
      - Mark the unit done in the scratchpad and emit cut.done.

      On review.rejected: fix exactly what the reviewer named, rerun the gates, commit
      the fix as a new commit, and emit cut.done.

  reviewer:
    name: "👀 Reviewer"
    description: "Checks each cut, and the final tree, against FIRST_PRINCIPLES.md"
    triggers: ["cut.done", "cuts.done"]
    publishes: ["review.approved", "review.rejected", "strip.verified"]
    default_publishes: "review.rejected"
    instructions: |
      Review with fresh eyes. Rerun the gates yourself; do not trust recorded output.

      On cut.done, check the latest commit:
      - It cut only what the unit named, and nothing on PROMPT.md's survive list.
      - No invariant lost its enforcement or its test.
      - No dangling references, no orphaned tests, docs, or config.
      - All gates pass.
      Emit review.approved, or review.rejected with file:line findings.
      At the end of a step of the order of work, also run the whole surviving test suite.

      On cuts.done, check every item of PROMPT.md's definition of done against the
      tree, except the push and pull request, which the finalizer owns.
      Emit strip.verified only when every item holds; otherwise emit
      review.rejected naming each failing item.

  finalizer:
    name: "📝 Finalizer"
    description: "Writes the report, pushes, opens the pull request, and ends the loop"
    triggers: ["strip.verified"]
    publishes: ["LOOP_COMPLETE"]
    instructions: |
      - Write .ralph/specs/strip/report.md: final measures against the
        FIRST_PRINCIPLES.md table, every decision noted for the captain, and every
        test that could not run here and why.
      - Push the branch fm/strip-first-principles.
      - Open a pull request against main with `gh pr create`, summarizing what was
        cut, what survives, and the report's measures and open decisions.
      - Never merge it.
      - Output LOOP_COMPLETE.
